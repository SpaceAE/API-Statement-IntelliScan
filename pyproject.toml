[project]
name = "Api-Statement-Intelliscan"
version = "0.1.0"
description = "RESTful api for AI scan statement"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.2",
    "fastapi[standard]>=0.116.1",
    "joblib>=1.5.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.7",
    "pydantic-settings>=2.10.1",
    "pypdf>=6.1.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "tensorflow>=2.20.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"
exclude = [".venv", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["FAST", "E", "F", "I"]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
exclude = [".venv", ".git", "__pycache__"]
